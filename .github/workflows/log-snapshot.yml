name: Log efficiency snapshot

# Re-saved to re-register the schedule trigger with GitHub's cron
# scheduler after it failed to fire for 2+ hours post-creation.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Call log-snapshot endpoint
        run: |
          curl -sf -X POST "https://boiler-efficiency-dashboard.vercel.app/api/log-snapshot" \
            -H "x-log-secret: ${{ secrets.LOG_SNAPSHOT_SECRET }}"
