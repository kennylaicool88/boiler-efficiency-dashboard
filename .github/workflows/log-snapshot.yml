name: Log efficiency snapshot

on:
  workflow_dispatch: {}

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Call log-snapshot endpoint
        run: |
          curl -sf -X POST "https://boiler-efficiency-dashboard.vercel.app/api/log-snapshot" \
            -H "x-log-secret: ${{ secrets.LOG_SNAPSHOT_SECRET }}"
